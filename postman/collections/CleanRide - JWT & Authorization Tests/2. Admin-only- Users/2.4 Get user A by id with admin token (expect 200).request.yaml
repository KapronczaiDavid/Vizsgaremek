$kind: http-request
url: "{{baseUrl}}/api/users/{{userAId}}"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('correct id', () => pm.expect(pm.response.json().id).to.eql(pm.collectionVariables.get('userAId')));
    language: text/javascript
order: 4000
