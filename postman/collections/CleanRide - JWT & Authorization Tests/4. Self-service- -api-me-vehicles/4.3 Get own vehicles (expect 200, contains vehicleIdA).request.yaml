$kind: http-request
url: "{{baseUrl}}/api/me/vehicles"
method: GET
headers:
  Authorization: Bearer {{tokenA}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('contains the created vehicle', () => {
        const arr = pm.response.json();
        pm.expect(arr.map(v => v.id)).to.include(pm.collectionVariables.get('vehicleIdA'));
      });
    language: text/javascript
order: 3000
