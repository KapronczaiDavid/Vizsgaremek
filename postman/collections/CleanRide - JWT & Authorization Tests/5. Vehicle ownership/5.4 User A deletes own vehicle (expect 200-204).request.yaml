$kind: http-request
name: 5.4 User A deletes own vehicle (expect 200/204)
url: "{{baseUrl}}/api/vehicles/{{vehicleIdA}}"
method: DELETE
headers:
  Authorization: Bearer {{tokenA}}
scripts:
  - type: afterResponse
    code: pm.test('status is 200 or 204', () => pm.expect([200,204]).to.include(pm.response.code));
    language: text/javascript
order: 4000
