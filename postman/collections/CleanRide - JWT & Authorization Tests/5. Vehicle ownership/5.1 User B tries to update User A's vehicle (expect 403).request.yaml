$kind: http-request
url: "{{baseUrl}}/api/vehicles/{{vehicleIdA}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenB}}
body:
  type: json
  content: '{"brand":"audi","licensePlate":"{{plateA}}","vehicleType":"suv"}'
scripts:
  - type: afterResponse
    code: pm.test('status is 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 1000
