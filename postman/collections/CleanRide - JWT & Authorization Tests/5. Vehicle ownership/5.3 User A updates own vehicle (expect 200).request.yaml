$kind: http-request
url: "{{baseUrl}}/api/vehicles/{{vehicleIdA}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenA}}
body:
  type: json
  content: '{"brand":"audi","licensePlate":"{{plateA}}","vehicleType":"suv"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('brand was updated', () => pm.expect(pm.response.json().brand.toLowerCase()).to.eql('audi'));
    language: text/javascript
order: 3000
