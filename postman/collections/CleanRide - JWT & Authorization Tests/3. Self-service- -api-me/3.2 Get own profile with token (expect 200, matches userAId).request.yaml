$kind: http-request
url: "{{baseUrl}}/api/me"
method: GET
headers:
  Authorization: Bearer {{tokenA}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('id matches logged-in user', () => pm.expect(pm.response.json().id).to.eql(pm.collectionVariables.get('userAId')));
    language: text/javascript
order: 2000
