$kind: http-request
url: "{{baseUrl}}/api/me"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenA}}
body:
  type: json
  content: '{"name":"User A Updated","email":"{{emailA}}","phone":"{{phoneA}}"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('name was updated', () => pm.expect(pm.response.json().name).to.eql('User A Updated'));
    language: text/javascript
order: 3000
