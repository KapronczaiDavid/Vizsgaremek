$kind: http-request
url: "{{baseUrl}}/api/users/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{custEmail}}",
      "password": "{{custPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test("token is returned", () => pm.expect(j.token).to.be.a("string").and.not.empty);
      pm.collectionVariables.set("customerToken", j.token);
      pm.collectionVariables.set("customerId", j.id);
    language: text/javascript
order: 3000
