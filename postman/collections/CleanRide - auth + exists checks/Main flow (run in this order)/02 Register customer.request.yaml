$kind: http-request
url: "{{baseUrl}}/api/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "PM Test",
      "email": "{{custEmail}}",
      "phone": "{{custPhone}}",
      "password": "{{custPassword}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      const n = Date.now();
      pm.collectionVariables.set("custEmail", "pm_" + n + "@test.com");
      pm.collectionVariables.set("custPhone", "+3620" + String(n).slice(-7));
      pm.collectionVariables.set("custPassword", "Test1234");
    language: text/javascript
  - type: afterResponse
    code: pm.test("200/201", () => pm.expect(pm.response.code).to.be.oneOf([200,201]));
    language: text/javascript
order: 2000
