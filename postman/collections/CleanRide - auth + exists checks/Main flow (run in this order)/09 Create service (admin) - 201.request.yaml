$kind: http-request
name: 09 Create service (admin) -> 201
url: "{{baseUrl}}/api/services"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: text
  content: |-
    {
      "name": "{{svcName}}",
      "description": "created by postman",
      "price": 5000,
      "durationMinutes": 30
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("svcName", "PM Wash " + Date.now());
    language: text/javascript
  - type: afterResponse
    code: pm.test("200/201", () => pm.expect(pm.response.code).to.be.oneOf([200,201]));
    language: text/javascript
order: 9000
