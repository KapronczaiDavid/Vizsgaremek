$kind: http-request
name: 04 Wrong password -> 401
url: "{{baseUrl}}/api/users/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{custEmail}}",
      "password": "rosszjelszo"
    }
scripts:
  - type: afterResponse
    code: pm.test("401", () => pm.response.to.have.status(401));
    language: text/javascript
order: 4000
