$kind: http-request
name: 05 GET /api/me as CUSTOMER -> 200
url: "{{baseUrl}}/api/me"
method: GET
headers:
  Authorization: Bearer {{customerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      pm.test("own email", () => pm.expect(pm.response.json().email).to.eql(pm.collectionVariables.get("custEmail")));
    language: text/javascript
order: 5000
