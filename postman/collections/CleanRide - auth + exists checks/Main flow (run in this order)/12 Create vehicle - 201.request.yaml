$kind: http-request
name: 12 Create vehicle -> 201
url: "{{baseUrl}}/api/me/vehicles"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
body:
  type: text
  content: |-
    {
      "brand": "bmw",
      "licensePlate": "{{plate}}",
      "vehicleType": "sedan"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("plate", "PM-" + String(Date.now()).slice(-6));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("200/201", () => pm.expect(pm.response.code).to.be.oneOf([200,201]));
      pm.collectionVariables.set("vehicle1Id", pm.response.json().id);
    language: text/javascript
order: 12000
