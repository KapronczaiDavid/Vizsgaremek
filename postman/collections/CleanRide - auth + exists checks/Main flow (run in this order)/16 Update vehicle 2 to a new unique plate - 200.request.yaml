$kind: http-request
name: 16 Update vehicle 2 to a new unique plate -> 200
url: "{{baseUrl}}/api/vehicles/{{vehicle2Id}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
body:
  type: text
  content: |-
    {
      "brand": "ford",
      "licensePlate": "{{plate3}}",
      "vehicleType": "suv"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("plate3", "PM-" + String(Date.now()).slice(-6) + "C");
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      pm.test("plate and brand changed", () => {
        const j = pm.response.json();
        pm.expect(j.licensePlate).to.eql(pm.collectionVariables.get("plate3"));
        pm.expect(j.brand).to.eql("ford");
      });
    language: text/javascript
order: 16000
