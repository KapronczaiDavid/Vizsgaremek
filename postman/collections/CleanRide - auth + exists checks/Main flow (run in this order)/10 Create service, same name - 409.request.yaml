$kind: http-request
name: 10 Create service, same name -> 409
url: "{{baseUrl}}/api/services"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: text
  content: |-
    {
      "name": "{{svcName}}",
      "description": "duplicate",
      "price": 5000,
      "durationMinutes": 30
    }
scripts:
  - type: afterResponse
    code: pm.test("409 (existsByName fix)", () => pm.response.to.have.status(409));
    language: text/javascript
order: 10000
