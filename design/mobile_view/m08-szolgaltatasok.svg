<svg xmlns="http://www.w3.org/2000/svg" width="390" height="884" viewBox="0 0 390 884" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="390" height="884" fill="#0b0b0e"/><text x="16" y="100" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#f2f2f6" text-anchor="start">Szolgáltatások</text><text x="16" y="124" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#9a9aaa" text-anchor="start">Foglaláshoz bejelentkezés szükséges. Csak az aktív</text><text x="16" y="144" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#9a9aaa" text-anchor="start">szolgáltatások látszanak.</text><g id="service-1-m"><rect x="16" y="176" width="358" height="112" rx="12" fill="#15151b" stroke="#2a2a36" stroke-width="1"/><text x="32" y="208" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f2f6" text-anchor="start">Külső mosás</text><text x="358" y="208" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#c084fc" text-anchor="end">8 000 Ft</text><text x="32" y="232" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#9a9aaa" text-anchor="start">Kézi mosás, szárítás, felnitisztítás.</text><text x="32" y="272" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#9a9aaa" text-anchor="start">~45 perc</text></g><g id="service-2-m"><rect x="16" y="300" width="358" height="112" rx="12" fill="#15151b" stroke="#2a2a36" stroke-width="1"/><text x="32" y="332" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f2f6" text-anchor="start">Beltéri detailing</text><text x="358" y="332" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#c084fc" text-anchor="end">22 000 Ft</text><text x="32" y="356" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#9a9aaa" text-anchor="start">Kárpit- és műanyagápolás, mélytisztítás.</text><text x="32" y="396" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#9a9aaa" text-anchor="start">~120 perc</text></g><g id="service-3-m"><rect x="16" y="424" width="358" height="112" rx="12" fill="#15151b" stroke="#2a2a36" stroke-width="1"/><text x="32" y="456" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f2f6" text-anchor="start">Polírozás</text><text x="358" y="456" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#c084fc" text-anchor="end">35 000 Ft</text><text x="32" y="480" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#9a9aaa" text-anchor="start">Karcok eltávolítása, fényvisszaállítás.</text><text x="32" y="520" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#9a9aaa" text-anchor="start">~180 perc</text></g><g id="service-4-m"><rect x="16" y="548" width="358" height="112" rx="12" fill="#15151b" stroke="#2a2a36" stroke-width="1"/><text x="32" y="580" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f2f6" text-anchor="start">Kerámia bevonat</text><text x="358" y="580" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#c084fc" text-anchor="end">80 000 Ft</text><text x="32" y="604" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#9a9aaa" text-anchor="start">Tartós védelem, vízlepergető hatás.</text><text x="32" y="644" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#9a9aaa" text-anchor="start">~300 perc</text></g><g id="service-5-m"><rect x="16" y="672" width="358" height="112" rx="12" fill="#15151b" stroke="#2a2a36" stroke-width="1"/><text x="32" y="704" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f2f6" text-anchor="start">Teljes detailing</text><text x="358" y="704" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#c084fc" text-anchor="end">65 000 Ft</text><text x="32" y="728" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#9a9aaa" text-anchor="start">Kül- és beltér teljes körű felújítása.</text><text x="32" y="768" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#9a9aaa" text-anchor="start">~360 perc</text></g><g id="btn-services-goto-login-m"><rect x="16" y="800" width="358" height="52" rx="10" fill="#9333ea" stroke="#9333ea" stroke-width="1"/><text x="195.0" y="831.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#f2f2f6" text-anchor="middle">Bejelentkezés a foglaláshoz</text></g><rect x="0" y="0" width="390" height="56" rx="0" fill="#15151b" stroke="#2a2a36" stroke-width="1"/><g id="logo-goto-home-m"><rect x="16" y="12" width="32" height="32" rx="8" fill="#9333ea" stroke="none" stroke-width="1"/><text x="32" y="33" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#f2f2f6" text-anchor="middle">CR</text><text x="58" y="26" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#f2f2f6" text-anchor="start">CLEAN RIDE</text><text x="58" y="39" font-family="Inter, Arial, sans-serif" font-size="7.5" font-weight="400" fill="#9a9aaa" text-anchor="start">COSMETICS · MOHÁCS</text></g><g id="btn-nav-login-m"><rect x="190" y="12" width="92" height="32" rx="10" fill="#1d1d26" stroke="#2a2a36" stroke-width="1"/><text x="236.0" y="33.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#f2f2f6" text-anchor="middle">Bejelentkezés</text></g><g id="btn-nav-register-m"><rect x="288" y="12" width="86" height="32" rx="10" fill="#9333ea" stroke="#9333ea" stroke-width="1"/><text x="331.0" y="33.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#f2f2f6" text-anchor="middle">Regisztráció</text></g></svg>