spring:
  application:
    name: cleanride

  datasource:
    url: jdbc:mysql://localhost:3306/cleanride?useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true