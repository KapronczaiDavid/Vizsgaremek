spring:
  mvc:
    log-resolved-exception: true
  application:
    name: cleanride

  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_SMTP_LOGIN}
    password: ${BREVO_SMTP_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cleanride?useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

server:
  # "none" when the app is reached directly; "framework" ONLY when behind your own reverse proxy,
  # otherwise clients could fake their IP and bypass the rate limits.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

verification:
  hmac-secret: ${VERIFICATION_HMAC_SECRET}
  code-ttl-minutes: 10
  max-attempts: 5
  resend-cooldown-seconds: 60
  max-sends-per-hour: 5
app:
  mail-from: ${MAIL_FROM}